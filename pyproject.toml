[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-track"
version = "0.1.7"
description = "Universal AI runtime for local and remote inference."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "openai>=1.0",
  "pydantic>=2.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "huggingface-hub>=0.24",
  "tqdm>=4.66",
]

[project.urls]
Source = "https://github.com/langelabs/ai-track"

[project.optional-dependencies]
macos = [
  "mlx>=0.24; sys_platform == 'darwin'",
  "mlx-embeddings>=0.0.4; sys_platform == 'darwin'",
  "mlx-lm>=0.24; sys_platform == 'darwin'",
  "mlx-vlm>=0.4; sys_platform == 'darwin'",
  "mlx-audio>=0.4; sys_platform == 'darwin'",
  "mflux>=0.5; sys_platform == 'darwin'",
]
cuda = [
  "torch>=2.2; sys_platform == 'linux'",
  "vllm>=0.11; sys_platform == 'linux'",
  "transformers>=4.45; sys_platform == 'linux'",
  "accelerate>=1.0; sys_platform == 'linux'",
  "diffusers>=0.30; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
]

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["track*"]
